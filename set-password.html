<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set Password</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;color:#fff}
    .box{width:min(520px,92vw);padding:22px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(0,0,0,.45)}
    input{width:100%;padding:12px 10px;margin:8px 0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:#0b0b0b;color:#fff}
    button{width:100%;padding:12px 10px;border-radius:10px;border:0;background:#22c55e;color:#001b08;font-weight:700;cursor:pointer}
    #msg{margin-top:12px;white-space:pre-wrap}
    code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <div class="box">
    <h2>Set your password</h2>
    <p>
      Open this page with <code>#invite_token=...</code> or <code>#recovery_token=...</code> at the end of the URL.
    </p>

    <form id="setPasswordForm">
      <label>New password</label>
      <input id="password" type="password" placeholder="New password (8+ chars)" required />

      <label>Confirm password</label>
      <input id="password2" type="password" placeholder="Confirm password" required />

      <button type="submit">Set password</button>
    </form>

    <div id="msg"></div>
  </div>

  <script>
    function getHashToken(name){
      const h = (location.hash || "").replace(/^#/, "");
      const params = new URLSearchParams(h);
      return params.get(name);
    }

    window.addEventListener("load", () => {
      const msg = document.getElementById("msg");
      const form = document.getElementById("setPasswordForm");

      if (!window.netlifyIdentity) {
        msg.textContent = "Netlify Identity script failed to load.";
        return;
      }

      netlifyIdentity.init();
      const gotrue = netlifyIdentity.gotrue;

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.textContent = "";

        const pw1 = document.getElementById("password").value.trim();
        const pw2 = document.getElementById("password2").value.trim();
        if (pw1.length < 8) { msg.textContent = "Password must be at least 8 characters."; return; }
        if (pw1 !== pw2) { msg.textContent = "Passwords do not match."; return; }

        const invite = getHashToken("invite_token");
        const recovery = getHashToken("recovery_token");

        try {
          msg.textContent = "Working…";

          if (invite) {
            await gotrue.acceptInvite(invite, pw1);
            msg.textContent = "Invite accepted ✅ Redirecting to /admin …";
            location.href = "/admin/";
            return;
          }

          if (recovery) {
            await gotrue.recover(recovery, pw1);
            msg.textContent = "Password reset ✅ Redirecting to /admin …";
            location.href = "/admin/";
            return;
          }

          msg.textContent = "No invite_token or recovery_token found in the URL.";
        } catch (err) {
          msg.textContent = "FAILED: " + (err?.message || err);
        }
      });
    });
  </script>
</body>
</html>
