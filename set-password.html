<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set Password</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;color:#fff}
    .box{width:min(520px,92vw);padding:22px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(0,0,0,.45)}
    input{width:100%;padding:12px 10px;margin:8px 0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:#0b0b0b;color:#fff}
    button{width:100%;padding:12px 10px;border-radius:10px;border:0;background:#22c55e;color:#001b08;font-weight:700;cursor:pointer}
    .muted{opacity:.75;font-size:14px}
    .err{color:#f87171;white-space:pre-wrap}
    .ok{color:#86efac;white-space:pre-wrap}
    code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <div class="box">
    <h2>Set your password</h2>
    <p class="muted">
      This page finishes Netlify Identity invites / password resets without popups.
      If your email link dumped you on the homepage with <code>#invite_token</code> or <code>#recovery_token</code>,
      paste that token URL into this page instead.
    </p>

    <div id="mode" class="muted"></div>

    <label>New password</label>
    <input id="pw1" type="password" placeholder="New password" />

    <label>Confirm password</label>
    <input id="pw2" type="password" placeholder="Confirm password" />

    <button id="go">Set password</button>

    <p id="msg" class="muted"></p>
    <pre id="out" class="err"></pre>
  </div>

  <script src="https://unpkg.com/gotrue-js@1.9.2/dist/gotrue.min.js"></script>
  <script>
    const out = document.getElementById("out");
    const msg = document.getElementById("msg");
    const modeEl = document.getElementById("mode");

    function hashParams() {
      const h = (location.hash || "").replace(/^#/, "");
      const p = {};
      h.split("&").forEach(part => {
        if(!part) return;
        const [k,v] = part.split("=");
        p[decodeURIComponent(k)] = decodeURIComponent(v || "");
      });
      return p;
    }

    const params = hashParams();
    const inviteToken = params.invite_token || "";
    const recoveryToken = params.recovery_token || "";
    const confirmationToken = params.confirmation_token || "";

    // Netlify Identity API endpoint for your site
    const auth = new GoTrue({
      APIUrl: location.origin + "/.netlify/identity",
      setCookie: true
    });

    let mode = "";
    if (inviteToken) mode = "invite";
    else if (recoveryToken) mode = "recovery";
    else if (confirmationToken) mode = "confirmation";

    modeEl.textContent = mode
      ? ("Detected: " + mode + " token ✅")
      : "No token detected ❌ (open this page with #invite_token=... or #recovery_token=...)";

    document.getElementById("go").addEventListener("click", async () => {
      out.textContent = "";
      msg.textContent = "";

      const pw1 = document.getElementById("pw1").value.trim();
      const pw2 = document.getElementById("pw2").value.trim();
      if (!pw1 || pw1.length < 8) return out.textContent = "Password must be at least 8 characters.";
      if (pw1 !== pw2) return out.textContent = "Passwords do not match.";

      try {
        msg.textContent = "Working…";

        if (inviteToken) {
          await auth.acceptInvite(inviteToken, pw1, true);
          msg.textContent = "Invite accepted. Redirecting to /admin …";
          location.href = "/admin/";
          return;
        }

        if (recoveryToken) {
          // Recover creates a session; then update password
          const user = await auth.recover(recoveryToken, true);
          await user.update({ password: pw1 });
          msg.textContent = "Password reset. Redirecting to /admin …";
          location.href = "/admin/";
          return;
        }

        out.textContent = "No invite/recovery token found in the URL hash.";
        msg.textContent = "";
      } catch (e) {
        msg.textContent = "";
        out.textContent = (e && (e.message || e.toString())) ? (e.message || e.toString()) : "Unknown error";
      }
    });
  </script>
</body>
</html>
