<section class="contact-hero">
  <div class="inner">
    <h1 style="font-size: clamp(38px, 5vw, 56px); font-weight:800; margin:0 0 6px;">Contact Us</h1>
    <p style="opacity:.9; margin:0 0 18px; font-size:clamp(16px, 2.2vw, 18px)">Fastest: call <a href="tel:0246267073" style="color:#fff; text-decoration:underline;">02 4626 7073</a>. Or send us a message.</p>
    <!--
      Updated contact form

      This form posts to formsubmit.co, a free service that forwards form submissions
      to the specified email address.  When you receive the first submission from
      this form you will be asked to confirm the email address.  After confirmation
      subsequent submissions will be delivered to your inbox without any additional
      configuration.

      To change the recipient email address, edit the `action` attribute below
      replacing `purebredmuaythaigym@gmail.com` with the desired address.  Do not remove
      the leading `https://formsubmit.co/`.  You can also customise the subject
      and autoresponse using the hidden `_subject` and `_autoresponse` fields.
    -->
    <form action="https://formsubmit.co/purebredmuaythaigym@gmail.com" method="POST" class="form-grid" autocomplete="on">
      <!--
        Formspree/formsubmit hidden inputs:
        _subject sets the email subject line.
        _template=table formats the message as a table for easier reading.
        _captcha disables the built‑in captcha for a smoother user experience.
        _autoresponse sends an automatic reply back to the sender (optional).
      -->
      <input type="hidden" name="_subject" value="New contact submission from Purebred Muay Thai">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_autoresponse" value="Thanks for contacting Purebred Muay Thai! We\'ll be in touch soon.">

      <input name="name" placeholder="Name" required>
      <input name="email" type="email" placeholder="Email" required>
      <input name="phone" placeholder="Phone">
      <select name="interest">
        <option>Kids / Teens / Adults / PT</option>
        <option>Mini Purebreds (4-7)</option>
        <option>Juniors (8-12)</option>
        <option>Teens (13-17)</option>
        <option>Adults (18+)</option>
        <option>1:1 PT</option>
      </select>
      <textarea name="msg" placeholder="Message"></textarea>
      <div><button class="btn-primary" type="submit">Send</button></div>
    </form>
  </div>

  <div class="visit">
    <h2 style="margin:6px 10px 8px; font-size:clamp(24px, 3vw, 28px);">Visit</h2>
    
    
<div class="map-wrap">
  
  <iframe 
    class="purebred-map"
    width="100%" 
    height="350" 
    loading="lazy" 
    allowfullscreen 
    referrerpolicy="no-referrer-when-downgrade" 
    src="https://www.google.com/maps?q=Purebred+Muay+Thai+1%2F8+Samantha+Place+Smeaton+Grange+NSW&output=embed">
  </iframe>

  <div style="text-align:right; margin-top:8px;">

       target="_blank" 
       style="color:#ffd86b; text-decoration:none; font-weight:700;">
      Open in Google Maps ↗
    </a>
  </div>
</div>


    <div class="addr">1/8 Samantha Place, Smeaton Grange NSW</div>
  </div>
