<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Review Card List</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{
      background:#111;
      padding:40px;
      color:#fff;
    }
    .test-container{
      max-width:600px;
      margin:0 auto;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <div class="review-card">
      <div class="stars">★★★★☆</div>
      <div class="snippet">This is a short review snippet to test centering of author and time.</div>
      <div class="author">John Doe</div>
      <div class="meta">1 year ago</div>
    </div>
  </div>
</body>
</html>
