<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Purebred Admin Access</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#111;color:#fff;}
    .box{max-width:520px;padding:22px;border:1px solid rgba(255,255,255,.2);border-radius:14px;background:rgba(0,0,0,.4)}
    a{color:#7dd3fc}
  </style>
</head>
<body>
  <div class="box">
    <h2>Loading secure sign-in…</h2>
    <p>If nothing pops up in 3 seconds, click:
      <a href="#" id="open">Open login</a>
    </p>
  </div>

  <script>
    // Open the Netlify Identity modal and then send you to /admin
    function openModal(){
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("login", () => window.location.replace("/admin/"));
        window.netlifyIdentity.on("signup", () => window.location.replace("/admin/"));
        window.netlifyIdentity.init();
        window.netlifyIdentity.open();
      }
    }
    document.getElementById("open").addEventListener("click", function(e){
      e.preventDefault();
      openModal();
    });
    // auto-open
    setTimeout(openModal, 300);
  </script>
</body>
</html>
