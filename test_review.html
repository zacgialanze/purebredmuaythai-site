<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Review Card</title>
  <!-- Include the same stylesheets used by the site -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="about-hero.css">
  <style>
    body{
      background:#111;
      padding:40px;
      color:#fff;
    }
    .test-container{
      max-width:600px;
      margin:0 auto;
    }
      /* Using production CSS for review cards; no test overrides */
      /* overrides removed; using main CSS */

</head>
<body>
  <div class="test-container">
    <article class="sticker">
      <div class="head">
        <!-- Use a built‑in logo for the avatar -->
        <img src="assets/doglogo.png" alt="Avatar">

      <div class="text">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Cras in dui libero. Sed mollis mauris ac felis semper, in tincidunt mi tempor.</div>
